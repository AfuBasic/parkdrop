name: 'parkdrop'

# Production compose file, meant to be deployed via Coolify.
#
# mysql IS bundled here (this reverses an earlier decision to run it as a
# separate, independently-managed Coolify resource — that split it onto a
# different Docker network than this app's own containers, which needed a
# second shared network just to let the two talk to each other. Keeping it
# in this compose file means the DB is reachable over the same `parkdrop`
# network as everything else, by the plain service name `mysql`, no
# extra networking required).
#
# All three backend processes share one built image; only `command:`
# differs per service, same pattern as compose.dev.yaml's Sail services.

x-backend-image: &backend-image
    build:
        # Root-relative, not relative to this file's own directory (platform/).
        # Coolify invokes `docker compose` with `--project-directory` set to
        # the repo root, which overrides Compose's normal behavior of
        # resolving relative paths against the compose file's location —
        # so `./backend` here would resolve to <repo-root>/backend (doesn't
        # exist) instead of <repo-root>/platform/backend.
        context: './platform/backend'
        dockerfile: Dockerfile
    image: 'parkdrop-backend:latest'

x-backend-env: &backend-env
    LOG_CHANNEL: '${LOG_CHANNEL:-stack}'
    DB_CONNECTION: 'mysql'
    DB_HOST: 'mysql'
    DB_PORT: 3306
    DB_DATABASE: '${DB_DATABASE}'
    DB_USERNAME: '${DB_USERNAME}'
    DB_PASSWORD: '${DB_PASSWORD}'
    REDIS_HOST: 'redis'
    REDIS_PORT: 6379
    REDIS_PASSWORD: '${REDIS_PASSWORD:-null}'
    CACHE_STORE: 'redis'
    SESSION_DRIVER: 'redis'
    QUEUE_CONNECTION: 'redis'
    # No reverb service — nothing in the app actually opens a WebSocket
    # connection to it yet (frontend has laravel-echo/pusher-js installed
    # but never imports them). Laravel's own default (BROADCAST_CONNECTION
    # unset -> 'null') is correct here; the one broadcast event that exists
    # server-side (SyncHint) just becomes a no-op instead of erroring.

services:
    backend:
        <<: *backend-image
        restart: unless-stopped
        # Target-port-only form ("80", no "host:container" prefix): Coolify
        # parses a compose service's `ports:` entries to know which
        # container port to route the resource's FQDN to when generating
        # its Traefik config — using `expose:` instead (tried first) left
        # Coolify with no port to route to at all, which is exactly what
        # produced "no available server" on the domain. This form still
        # avoids a fixed host-port collision (that's what "8000:80"
        # originally broke on) since Compose publishes it to an ephemeral
        # host port rather than a hardcoded one, while keeping the port
        # visible to Coolify's own routing logic.
        ports:
            - '80'
        environment:
            <<: *backend-env
            # Only this service runs migrations on boot — see entrypoint.sh.
            RUN_MIGRATIONS: 'true'
        volumes:
            - 'backend-storage:/var/www/html/storage/app'
        networks:
            - parkdrop
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_started
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://localhost/up']
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 30s

    horizon:
        <<: *backend-image
        restart: unless-stopped
        command: ['php', 'artisan', 'horizon']
        environment: *backend-env
        volumes:
            - 'backend-storage:/var/www/html/storage/app'
        networks:
            - parkdrop
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_started

    scheduler:
        <<: *backend-image
        restart: unless-stopped
        command: ['php', 'artisan', 'schedule:work']
        environment: *backend-env
        volumes:
            - 'backend-storage:/var/www/html/storage/app'
        networks:
            - parkdrop
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_started

    redis:
        image: 'redis:alpine'
        restart: unless-stopped
        volumes:
            - 'parkdrop-redis:/data'
        networks:
            - parkdrop
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            retries: 3
            timeout: 5s

    mysql:
        image: 'mysql:8.4'
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
        volumes:
            # Named volume — survives container restarts/redeploys/image
            # updates. It's only destroyed by an explicit `docker volume rm`
            # or removing the resource in Coolify, never by a normal
            # redeploy. This is what makes the data actually persist.
            - 'parkdrop-mysql:/var/lib/mysql'
        # Bound to the host's loopback only (127.0.0.1), not 0.0.0.0 —
        # reachable from Sequel Ace via an SSH tunnel to the server, but
        # never exposed to the public internet. Publishing 3306 openly on
        # a VPS gets it hit by credential-stuffing bots within minutes; an
        # SSH tunnel costs one extra step in Sequel Ace's connection setup
        # (its "SSH" tab: SSH host = your server, SSH user = your login,
        # then MySQL host = 127.0.0.1, port = 3306, same DB credentials)
        # and closes that whole attack surface.
        ports:
            - '127.0.0.1:3306:3306'
        networks:
            - parkdrop
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s

networks:
    parkdrop:
        driver: bridge

volumes:
    parkdrop-redis:
        driver: local
    backend-storage:
        driver: local
    parkdrop-mysql:
        driver: local
