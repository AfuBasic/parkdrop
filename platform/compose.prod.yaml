name: 'parkdrop'

# Production compose file, meant to be deployed via Coolify.
#
# Deliberately does NOT include a mysql service — the database is a
# separately managed Coolify resource (its own container/volume/backups,
# outside this app's lifecycle). Point DB_HOST/DB_PORT/DB_DATABASE/
# DB_USERNAME/DB_PASSWORD (set as env vars on this app in Coolify) at that
# resource. Everything else the backend depends on (redis) is still
# bundled here since nothing external was asked for it — split it out the
# same way later if that ever needs to change.
#
# All three backend processes share one built image; only `command:`
# differs per service, same pattern as compose.dev.yaml's Sail services.

x-backend-image: &backend-image
    build:
        # Root-relative, not relative to this file's own directory (platform/).
        # Coolify invokes `docker compose` with `--project-directory` set to
        # the repo root, which overrides Compose's normal behavior of
        # resolving relative paths against the compose file's location —
        # so `./backend` here would resolve to <repo-root>/backend (doesn't
        # exist) instead of <repo-root>/platform/backend.
        context: './platform/backend'
        dockerfile: Dockerfile
    image: 'parkdrop-backend:latest'

x-backend-env: &backend-env
    LOG_CHANNEL: '${LOG_CHANNEL:-stack}'
    DB_CONNECTION: '${DB_CONNECTION:-mysql}'
    DB_HOST: '${DB_HOST}'
    DB_PORT: '${DB_PORT:-3306}'
    DB_DATABASE: '${DB_DATABASE}'
    DB_USERNAME: '${DB_USERNAME}'
    DB_PASSWORD: '${DB_PASSWORD}'
    REDIS_HOST: 'redis'
    REDIS_PORT: 6379
    REDIS_PASSWORD: '${REDIS_PASSWORD:-null}'
    CACHE_STORE: 'redis'
    SESSION_DRIVER: 'redis'
    QUEUE_CONNECTION: 'redis'
    # No reverb service — nothing in the app actually opens a WebSocket
    # connection to it yet (frontend has laravel-echo/pusher-js installed
    # but never imports them). Laravel's own default (BROADCAST_CONNECTION
    # unset -> 'null') is correct here; the one broadcast event that exists
    # server-side (SyncHint) just becomes a no-op instead of erroring.

services:
    backend:
        <<: *backend-image
        restart: unless-stopped
        # Target-port-only form ("80", no "host:container" prefix): Coolify
        # parses a compose service's `ports:` entries to know which
        # container port to route the resource's FQDN to when generating
        # its Traefik config — using `expose:` instead (tried first) left
        # Coolify with no port to route to at all, which is exactly what
        # produced "no available server" on the domain. This form still
        # avoids a fixed host-port collision (that's what "8000:80"
        # originally broke on) since Compose publishes it to an ephemeral
        # host port rather than a hardcoded one, while keeping the port
        # visible to Coolify's own routing logic.
        ports:
            - '80'
        environment:
            <<: *backend-env
            # Only this service runs migrations on boot — see entrypoint.sh.
            RUN_MIGRATIONS: 'true'
        volumes:
            - 'backend-storage:/var/www/html/storage/app'
        # parkdrop: talks to redis/horizon/scheduler. coolify: the shared
        # network every Coolify resource on the server joins — needed to
        # resolve and reach the standalone MySQL container, which is its
        # own separate Coolify resource (own compose project, own private
        # network) that `parkdrop` alone can never see. Without this,
        # DB_HOST fails DNS resolution entirely ("getaddrinfo ... failed"),
        # not just a refused/timed-out connection.
        networks:
            - parkdrop
            - coolify
        depends_on:
            - redis
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://localhost/up']
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 30s

    horizon:
        <<: *backend-image
        restart: unless-stopped
        command: ['php', 'artisan', 'horizon']
        environment: *backend-env
        volumes:
            - 'backend-storage:/var/www/html/storage/app'
        networks:
            - parkdrop
            - coolify
        depends_on:
            - redis

    scheduler:
        <<: *backend-image
        restart: unless-stopped
        command: ['php', 'artisan', 'schedule:work']
        environment: *backend-env
        volumes:
            - 'backend-storage:/var/www/html/storage/app'
        networks:
            - parkdrop
            - coolify
        depends_on:
            - redis

    redis:
        image: 'redis:alpine'
        restart: unless-stopped
        volumes:
            - 'parkdrop-redis:/data'
        networks:
            - parkdrop
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            retries: 3
            timeout: 5s

networks:
    parkdrop:
        driver: bridge
    # Pre-existing network Coolify creates itself on the host — declared
    # `external` so Compose attaches to it instead of trying to create it.
    # If your server's shared network has a different name (check with
    # `docker network ls` — look for the one every Coolify resource joins,
    # not this project's own auto-namespaced parkdrop one), change the
    # `name:` below to match.
    coolify:
        external: true
        name: coolify

volumes:
    parkdrop-redis:
        driver: local
    backend-storage:
        driver: local
