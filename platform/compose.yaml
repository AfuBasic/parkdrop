# Local development only (Laravel Sail). Builds the Sail Ubuntu runtime
# from vendor/laravel/sail and bind-mounts source from the host — neither
# of which belongs in production. This is the file `docker compose` and
# `sail` pick up by default (auto-discovered by name) when run from
# anywhere under platform/.
#
# Production deploys use platform/compose.prod.yaml instead (Coolify is
# pointed at it explicitly) — a from-scratch image with the app baked in,
# and no bundled mysql service since that's a separately managed resource.
name: 'parkdrop'
services:
    backend:
        build:
            context: './backend/vendor/laravel/sail/runtimes/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
        image: 'sail-8.5/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '8000:80'
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}/backend'
        volumes:
            - './backend:/var/www/html'
        networks:
            - sail
        depends_on:
            - mysql
            - redis
    mysql:
        image: 'mysql:8.4'
        ports:
            - '33061:3306'
        environment:
            MYSQL_ROOT_PASSWORD: ''
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: 'parkdrop'
            MYSQL_USER: 'sail'
            MYSQL_PASSWORD: 'password'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
        volumes:
            - 'sail-mysql:/var/lib/mysql'
            - './backend/vendor/laravel/sail/database/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p'
            retries: 3
            timeout: 5s
    redis:
        image: 'redis:alpine'
        ports:
            - '6379:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
    reverb:
        build:
            context: './backend/vendor/laravel/sail/runtimes/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
        image: 'sail-8.5/app'
        command: ['php', 'artisan', 'reverb:start', '--host=0.0.0.0', '--port=8080']
        ports:
            - '8081:8080'
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
        volumes:
            - './backend:/var/www/html'
        networks:
            - sail
        depends_on:
            - redis
            - mysql
    horizon:
        build:
            context: './backend/vendor/laravel/sail/runtimes/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
        image: 'sail-8.5/app'
        command: ['php', 'artisan', 'horizon']
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
        volumes:
            - './backend:/var/www/html'
        networks:
            - sail
        depends_on:
            - redis
            - mysql
    scheduler:
        # Drives every Schedule::command(...) entry in routes/console.php —
        # outbox:process (turns a package's outbox event into the actual
        # SendArrivalSmsJob dispatch), sms:reconcile, and the scheduler
        # heartbeat health probes in production. `schedule:work` is Laravel's
        # own loop that fires the scheduler every minute; it exists
        # specifically so a container doesn't need host cron.
        build:
            context: './backend/vendor/laravel/sail/runtimes/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
        image: 'sail-8.5/app'
        command: ['php', 'artisan', 'schedule:work']
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
        volumes:
            - './backend:/var/www/html'
        networks:
            - sail
        depends_on:
            - redis
            - mysql
networks:
    sail:
        driver: bridge
volumes:
    sail-mysql:
        driver: local
    sail-redis:
        driver: local
